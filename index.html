<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filament Outsource Tracing</title>
  <style>
    :root {
      --bg-color: #0b1329;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 16px 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* 圖片容器 (大幅放大並增強清晰度) */
    .brand-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 12px;
      background-color: #0f172a;
      border: 1.5px solid var(--border-color);
      padding: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .brand-logo:hover {
      border-color: var(--accent);
      transform: scale(1.02);
    }

    .badge-pro {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    h1 {
      margin: 0;
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.1;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .sheet-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 8px 8px 0 0;
      border: 1px solid var(--border-color);
      border-bottom: none;
      overflow-x: auto;
    }

    .sheet-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: grab;
      border: 1px solid var(--border-color);
      user-select: none;
    }

    .sheet-tab:active { cursor: grabbing; }

    .sheet-tab.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }

    .sheet-close {
      font-size: 0.75rem;
      opacity: 0.7;
      cursor: pointer;
    }
    .sheet-close:hover {
      opacity: 1;
      color: #f87171;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }

    .btn {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary { background-color: #0284c7; color: #fff; border: none; }
    .btn-primary:hover { background-color: #0369a1; color: #fff; }

    .tab-content {
      display: none;
      flex: 1;
      overflow: auto;
      background-color: var(--card-bg);
      border-radius: 0 0 10px 10px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
    }

    .tab-content.active { display: block; }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #0f172a;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
      user-select: none;
    }

    td {
      padding: 9px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.88rem;
      color: var(--text-main);
      vertical-align: middle;
    }

    tr:hover td { background-color: rgba(255, 255, 255, 0.03); }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand-title">
        <!-- 放大後的圖示區域 (雙擊可替換圖片網址) -->
        <img id="app-logo" class="brand-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z'/></svg>" alt="Logo" title="雙擊可更改圖片網址">
        <div>
          <span class="badge-pro">PRO ENTERPRISE</span>
          <h1>Filament Outsource Tracing</h1>
        </div>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active">專案進度追蹤表</button>
    </div>

    <div class="sheet-bar">
      <div id="sheets-container" style="display: flex; gap: 6px;"></div>
      <button id="add-sheet-btn" class="btn" style="padding: 2px 8px; font-size: 0.8rem;">新增工作表</button>
      <button id="copy-sheet-btn" class="btn" style="padding: 2px 8px; font-size: 0.8rem;">複製工作表</button>
    </div>

    <div id="tracker-tab" class="tab-content active">
      <div class="toolbar" style="padding: 12px 16px 0 16px;">
        <button id="add-row-btn" class="btn btn-primary">新增料號項目</button>
        <button id="add-col-btn" class="btn btn-primary">新增自訂欄位</button>
      </div>
      <div style="padding: 12px 16px;">
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // 雙擊 Logo 圖片可更新圖片網址
    document.getElementById('app-logo').ondblclick = () => {
      const newUrl = prompt("請輸入 Logo 圖片網址 (URL)：", document.getElementById('app-logo').src);
      if (newUrl) {
        document.getElementById('app-logo').src = newUrl;
        localStorage.setItem('outsource_filament_logo', newUrl);
      }
    };
    if (localStorage.getItem('outsource_filament_logo')) {
      document.getElementById('app-logo').src = localStorage.getItem('outsource_filament_logo');
    }
  </script>
</body>
</html>
